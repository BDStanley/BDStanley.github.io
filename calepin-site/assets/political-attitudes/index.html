<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social and political trends in Poland since 1990</title>
<meta name="theme-color" content="#8B0000">
<!--
  Social and political trends (formerly Political attitudes): long-run trends in Poles' attitudes,
  values and lives, each estimated from several survey sources at
  once, with breakdowns by party, age, gender, education and place of residence. Embedded in
  pages/polish-political-analyses/political-attitudes.typ; works on its own too.
  Data: attitudes.json (the index) and one <slug>.json per attitude beside this file, written by
  "Political attitudes/web/build_web.R" in the Polish political analyses repo and copied here by
  scripts/sync-analyses.py on each build. Logic in app.js; no libraries.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#141414; --soft:#4B4B4B; --muted:#767676; --faint:#D5D5D5; --rule:#ECECEC;
  --chip:#F3F3F1; --accent:#8B0000; --accent-hover:#495057; --tint:#F6EBEB;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Jost,"Avenir Next",-apple-system,"Helvetica Neue",sans-serif;font-weight:400;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}
.app{display:flex;flex-direction:column;gap:12px;padding:12px 16px 20px;max-width:1440px;margin:0 auto}
.label{font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.head h2{margin:2px 0 0;font-size:24px;font-weight:300;letter-spacing:-.01em;color:var(--accent);line-height:1.2}
.asof{font-size:12.5px;color:var(--muted);line-height:1.45;margin:2px 0 0}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--chip);border-radius:999px}
.seg button{border:0;border-radius:999px;padding:0 13px;height:32px;font-size:13.5px;font-weight:500;cursor:pointer;background:transparent;color:var(--soft)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4;cursor:default}
.seg.small button{height:28px;font-size:12.5px;padding:0 10px}
.ctl{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft)}
button,input,select{font-family:inherit}
select.sel{height:32px;border:1px solid var(--faint);border-radius:8px;padding:0 8px;background:#fff;color:var(--ink);font-size:13.5px;max-width:min(330px,100%)}
select.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,0,0,.14)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none;color:var(--soft)}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--faint);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--faint);background:#fff;color:var(--ink);font-size:12.5px;cursor:pointer}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip[aria-pressed="false"] .dot{opacity:.25}
.chip:hover{border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.btn2{height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--faint);background:transparent;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer}
.btnrow{display:inline-flex;gap:6px}
.btn2.sm{height:28px;padding:0 12px;font-size:12px}
.btn2:hover{border-color:var(--accent);color:var(--accent)}
.linkbtn{border:0;background:transparent;padding:0 4px;color:var(--accent);cursor:pointer;font-size:12.5px}
.linkbtn:hover{color:var(--accent-hover)}
.spacer{flex:1}
.chartbox{position:relative;border:1px solid var(--rule);border-radius:14px;padding:6px 6px 2px}
.chartbox svg{display:block;width:100%;height:auto;font-family:Jost,"Avenir Next",sans-serif;overflow:visible;user-select:none}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--faint);border-radius:10px;padding:8px 10px;
  font-size:12.5px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.08);z-index:5;min-width:170px;max-width:320px;display:none}
.tip b{font-weight:600}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .r span:last-child{white-space:nowrap}
.tip .s{color:var(--muted);font-size:11.5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--soft);padding:2px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:18px;height:10px;border-radius:3px;display:inline-block}
.help{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px}
.card{border:1px solid var(--faint);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font-weight:500;color:var(--muted);text-align:right;padding:3px 6px;border-bottom:1px solid var(--rule);font-size:12px;vertical-align:bottom}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--rule);vertical-align:top}
table.t td.l{text-align:left}
table.t td small{color:var(--muted);font-size:11.5px}
.pos{color:#1b6e2d}.neg{color:#a11d1d}
.big{font-size:30px;font-weight:300;line-height:1.1;color:var(--ink)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.loading{padding:40px;color:var(--muted);font-size:15px}
.scroll{max-height:340px;overflow-y:auto}
@media (max-width:960px){ .two{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){ .app{padding:10px 10px 16px} .head h2{font-size:20px} .seg button{padding:0 10px} }
/* Chart labels in thin Jost, as across the site; an explicit font-weight (emphasis) keeps its weight. */
svg text:not([font-weight]){font-weight:300}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Loading…</div>
  <div id="ui" hidden>
    <div class="head">
      <div>
        <div class="label">Social and political trends in Poland</div>
        <h2 id="title"></h2>
        <p class="asof" id="measure"></p>
      </div>
      <label class="ctl">Attitude <select class="sel" id="attitudes"></select></label>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <div class="seg" id="breaks" role="group" aria-label="Breakdown"></div>
      <div class="seg small" id="periods" role="group" aria-label="Period"></div>
      <label class="switch"><input type="checkbox" id="pts" checked> Survey readings</label>
      <label class="switch"><input type="checkbox" id="evs" checked> Events</label>
    <span class="btnrow" style="margin-left:auto">      <button class="btn2 sm" id="dlcsv" type="button">CSV</button><button class="btn2 sm" id="dlpng" type="button">PNG</button><button class="btn2 sm" id="share" type="button">Copy link</button></span>
    </div>
    <div class="chips" id="chips" style="margin-top:10px"></div>
    <div class="chartbox" style="margin-top:10px">
      <svg id="chart" role="img" aria-label="Trend chart"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend" id="legend" style="margin-top:6px"></div>
    <p class="help" id="note" style="margin-top:4px"></p>
    <div class="two" style="margin-top:12px">
      <div class="card">
        <div class="label" id="latesthead">Latest estimates</div>
        <div id="latest"></div>
      </div>
      <div class="card">
        <div class="label">Survey questions pooled</div>
        <p class="help" id="srcnote"></p>
        <div class="scroll"><table class="t" id="items"></table></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../chart-export.js"></script>
<script src="app.js"></script>
</body>
</html>
