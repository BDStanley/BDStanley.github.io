# =============================================================================
# Quarto BACKUP of benstanley.eu — a parallel rebuild of the Calepin site
# (../calepin-site) using Quarto instead of Typst/Calepin.
#
# This project is fully self-contained and DOES NOT deploy. The live site is
# produced by ../calepin-site/build.sh -> ../docs (GitHub Pages). This Quarto
# version renders into ./_site only, so it never touches ../docs. It exists so
# the site can be switched back to a Quarto toolchain in future with the same
# functionality. See README.md.
#
# Single source of truth: cv/cv.yml builds the CV PDF *and* feeds the
# Research outputs (publications.qmd) and Research projects pages (read with the R `yaml` package),
# exactly as the Calepin site does.
# =============================================================================

project:
  type: website
  output-dir: _site          # local build only — NOT ../docs (the live site)
  execute-dir: project       # run R chunks from the project root, so cv/cv.yml resolves
  render:
    - index.qmd
    - 404.qmd
    - pages/publications.qmd
    - pages/citation-reach.qmd   # linked from Research outputs (publications.qmd), not the navbar
    - pages/policy-reach.qmd     # likewise
    - pages/media-reach.qmd      # likewise
    - pages/research-projects.qmd
    - pages/teaching.qmd
    - pages/teaching/*.qmd
    - pages/media.qmd
    - pages/pooling-the-poles.qmd
    - pages/good-change.qmd

website:
  title: "Ben Stanley"
  description: "Associate Professor at the Centre for the Study of Democracy, SWPS University. Research on populism, illiberalism and authoritarianism in Central and Eastern Europe."
  page-navigation: false
  # No search box, as on the Calepin site (its pagefind search is switched off).
  search: false
  # Copied from ../calepin-site/assets (made by its scripts/make-favicon.py).
  favicon: assets/favicon.svg

  # The two items of the Calepin footer (calepin.toml [footer]), the credit
  # naming this toolchain. Laid out like Calepin's in assets/styles/styles.css.
  page-footer:
    left: "[© 2026 Ben Stanley · CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
    right: "[Made with R and Quarto](https://quarto.org/)"

  navbar:
    # Hamburger at phone width only (<768px), like the Calepin site's 48rem.
    collapse-below: md
    # The "Ben Stanley" title (top-left) links to the home page, so — like the
    # Calepin site — there is no separate "Home" entry.
    left:
      - href: pages/publications.qmd
        text: Research outputs
      - href: pages/research-projects.qmd
        text: Research projects
      - href: pages/teaching.qmd
        text: Teaching
      - href: pages/media.qmd
        text: Media
      - href: pages/pooling-the-poles.qmd
        text: Pooling the Poles
      - href: pages/good-change.qmd
        text: Good Change

    right:
      - href: cv/cv.pdf
        text: CV

      - text: "{{< fa brands linkedin >}}"
        href: https://www.linkedin.com/in/ben-stanley-0452803b8

      - text: "{{< fa brands whatsapp >}}"
        href: "tel:+48798814801"

      - text: "{{< iconify lucide mail title='E-mail' >}}"
        href: mailto:bstanley@swps.edu.pl

      - text: "{{< iconify fa6-brands bluesky title='Bluesky' >}}"
        href: https://bsky.app/profile/benstanley.eu

      - text: "{{< ai orcid >}}"
        href: https://orcid.org/0000-0001-6932-1046

      - text: "{{< iconify simple-icons googlescholar title='Google Scholar' >}}"
        href: https://scholar.google.com/citations?user=8AO7H9gAAAAJ&hl=en

      # No icon font has OpenAlex: assets/styles/styles.css swaps this text
      # label for the logo in assets/icons/openalex.svg.
      - text: "OpenAlex"
        href: https://openalex.org/authors/A5015716464

      - text: "{{< ai scopus >}}"
        href: https://www.scopus.com/authid/detail.uri?authorId=23493968300

      - text: "{{< iconify fa6-brands github title='GitHub' >}}"
        href: https://github.com/BDStanley

      - text: "{{< ai dataverse >}}"
        href: https://dataverse.harvard.edu/dataverse/bdstanley

      - text: "{{< ai zotero >}}"
        href: https://www.zotero.org/benstanleypl/library

# The CV PDF (built from cv/cv.yml by build.sh) is linked from the navbar; make
# sure Quarto copies it into the output even though no .qmd references it.
resources:
  - cv/cv.pdf
  - assets/icons/openalex.svg
  # PNG/ICO favicons, linked from assets/includes/head.html (build.sh also copies
  # favicon.ico to the site root, as the Calepin build does).
  - assets/favicon-32.png
  - assets/apple-touch-icon.png
  - assets/favicon.ico

# Never let R chunk warnings/messages leak onto the rendered pages (the
# CV-driven and Media pages run R). Code is hidden site-wide; output stays.
execute:
  warning: false
  message: false
  echo: false

format:
  html:
    theme:
      - assets/styles/website_style.scss
    css: assets/styles/styles.css
    toc: false
    # No hover "#" links on headings (the Calepin site has none).
    anchor-sections: false
    include-in-header: assets/includes/head.html
    include-after-body: assets/includes/navbar-social.html
    # Ordinary spaces after "ed."/"eds."/"et al.", as on the Calepin site.
    filters:
      - filters/plain-spaces.lua
    # The reading column (Calepin's 39rem) is set in assets/styles/styles.css.
