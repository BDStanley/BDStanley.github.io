<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the polls stand: Election 2027</title>
<meta name="theme-color" content="#8B0000">
<!--
  The live panel of the Election 2027 page (pages/polish-political-analyses/election-2027.typ, generated by
  scripts/sync-analyses.py), embedded as an iframe that this page sizes to its content. It reads the Polling
  tracker's ../polling-tracker/polls.json in the browser, so it shows the tracker's latest week after every Polls
  run, and posts.json beside it (the published posts, for the change since the last one). Each panel links into the
  tracker. Logic in app.js; no libraries.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../site.css">
<style>
body{background:#fff}
.live{border:1px solid var(--rule);border-radius:16px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;margin:2px}
.livehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
h2{font-weight:300;color:var(--accent);font-size:26px;letter-spacing:-.01em;line-height:1.2;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.panel{border:1px solid var(--faint);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.more{font-size:12.5px;margin-top:auto;padding-top:4px}
.red{color:var(--accent);font-weight:500}
.dot{margin-right:6px;vertical-align:0;width:9px;height:9px}
table.t{font-size:12.5px}
table.t td{white-space:nowrap}
.since{font-size:12px;color:var(--soft);line-height:1.5;margin:0}
.maj{display:flex;flex-direction:column;gap:3px;font-size:13px}
.maj .row{display:flex;justify-content:space-between;gap:8px}
.track{position:relative;height:8px;border-radius:999px;background:var(--chip)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.fill.gov{background:var(--muted)}
.tick{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink)}
svg{display:block;width:100%;height:auto}
.hemi{max-width:300px;margin:0 auto}
.carto{max-width:290px;margin:0 auto}
.carto circle{cursor:default}
.err{color:var(--warn)}
</style>
</head>
<body>
<section class="live" aria-label="Where the polls stand">
  <div class="livehead">
    <h2>Where the polls stand</h2>
    <span class="help" id="asof">Loading the Polling tracker's latest week…</span>
  </div>
  <div class="grid" id="grid"></div>
</section>
<script src="../site-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
