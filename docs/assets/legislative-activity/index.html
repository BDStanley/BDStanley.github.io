<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legislative activity: what members do in the Sejm, the Senate and the European Parliament</title>
<meta name="theme-color" content="#8B0000">
<!--
  Legislative activity: how Sejm clubs and MPs vote, attend, speak and ask questions, terms 3-10 (1997-2026), with the
  topics of legislation passed. Embedded in pages/polish-political-analyses/legislative-activity.typ; works on its own too.
  Data: legislative.json (the Sejm), senate-legislative.json and ep-legislative.json, and the per-term files each lists (mps-, roles-, rebels- and votes-<term>[-<chunk>].json) beside
  this file, written by "Sejm analysis/Legislative activity/R/la90_export_web.R" in the Polish political analyses repo and
  copied here by scripts/sync-analyses.py on each build. Logic in app.js; no libraries.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#141414; --soft:#4B4B4B; --muted:#767676; --faint:#D5D5D5; --rule:#ECECEC;
  --chip:#F3F3F1; --accent:#8B0000; --accent-hover:#495057; --tint:#F6EBEB; --warn:#8A5A00;
  --yes:#2F7D4F; --no:#A11D1D; --abs:#8A6D00;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Jost,"Avenir Next",-apple-system,"Helvetica Neue",sans-serif;font-weight:400;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover)}
.app{min-height:100vh;display:flex;flex-direction:column;gap:12px;padding:12px 16px 24px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--chip);border-radius:999px}
.seg button{border:0;border-radius:999px;padding:0 13px;height:32px;font-size:13.5px;font-weight:500;cursor:pointer;background:transparent;color:var(--soft)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.35;cursor:default}
.seg.small button{height:28px;font-size:12.5px;padding:0 10px}
.ctl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--soft)}
.sel,input[type=search]{height:32px;border:1px solid var(--faint);border-radius:8px;padding:0 8px;background:#fff;color:var(--ink);font-size:13px;max-width:100%}
.sel:focus,input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,0,0,.14)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--faint);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:16px}
.view{display:flex;flex-direction:column;gap:12px}
.help{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0;max-width:980px}
.lead{font-size:13.5px;color:var(--soft);line-height:1.5;margin:0;max-width:980px}
.notice{font-size:13px;color:var(--warn);line-height:1.45;margin:0;padding:8px 12px;border-radius:10px;background:#FBF4E6}
h2{font-size:17px;font-weight:600;margin:0}
h3{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.chartbox{position:relative;border:1px solid var(--rule);border-radius:14px;padding:12px 14px 10px}
.chartbox svg{display:block;width:100%;height:auto;font-family:Jost,"Avenir Next",sans-serif;overflow:visible;user-select:none}
svg text{font-size:11px;fill:var(--muted)} svg text.t{fill:var(--ink)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--soft);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:0;border-top:2.6px solid;flex:none}
.sw.dots{border-top-style:dotted}.sw.sq{height:10px;border:0;width:10px;border-radius:2px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right}
.ledger{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.ledger{grid-template-columns:1fr}}
.find{display:flex;flex-direction:column;gap:8px}
.list{max-height:540px;overflow:auto;border:1px solid var(--rule);border-radius:12px}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--rule);cursor:pointer}
.row:last-child{border-bottom:0}.row:hover{background:var(--chip)}
.row[aria-selected="true"]{background:var(--tint)}
.row .bar{width:5px;height:26px;border-radius:2px}
.row small{display:block;color:var(--muted);font-size:11.5px}.row .r{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--faint);font-size:12.5px;background:#fff}
.chip.flag{border-color:var(--accent);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.stat{border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:600;line-height:1.15}.stat span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:14px}
.vote{font-size:11px;font-weight:600;padding:1px 6px;border:1px solid currentColor;border-radius:4px}
.vote.YES{color:var(--yes)}.vote.NO{color:var(--no)}.vote.ABSTAIN{color:var(--abs)}
.pg{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12.5px}
.btn2{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--faint);background:transparent;color:var(--ink);font-size:12px;font-weight:500;cursor:pointer}
.btn2:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}.btn2:disabled{opacity:.4;cursor:default}
.tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--faint);border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.08);z-index:5;max-width:300px;display:none}
.heat td{text-align:center;padding:4px 6px;font-size:12px}.heat td:first-child,.heat th:first-child{text-align:left}
.foot{font-size:12px;color:var(--muted);line-height:1.5;max-width:980px}
.foot ul{margin:6px 0 0;padding-left:18px}
.loading{color:var(--muted);padding:20px 4px}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar" id="tb"></div>
  <div class="view" id="main"><div class="loading">Loading…</div></div>
  <div class="foot" id="foot"></div>
</div>
<div class="tip" id="tip"></div>
<script src="app.js"></script>
</body>
</html>
